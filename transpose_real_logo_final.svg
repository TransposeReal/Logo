<filter id="glitch_r">
<feTurbulence type="fractalNoise" baseFrequency="0.01 0.9" numOctaves="2" result="turbulence_r"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="turbulence_r" scale="10" xChannelSelector="R" yChannelSelector="G" result="displaced_base_r"></feDisplacementMap>
<feOffset in="displaced_base_r" dx="-5" dy="0" result="offset_geom1_r"></feOffset>
<feOffset in="displaced_base_r" dx="5" dy="0" result="offset_geom2_r"></feOffset>
<feFlood result="flood1_r" flood-color="#EE00EE" flood-opacity="1"></feFlood>
<feFlood result="flood2_r" flood-color="#7FFF00" flood-opacity="1"></feFlood>
<feComposite in="flood1_r" in2="offset_geom1_r" operator="in" result="layer1_r"></feComposite>
<feComposite in="flood2_r" in2="offset_geom2_r" operator="in" result="layer2_r"></feComposite>
<feMerge>
<feMergeNode in="layer1_r"></feMergeNode>
<feMergeNode in="layer2_r"></feMergeNode>
<feMergeNode in="displaced_base_r"></feMergeNode>
</feMerge>
</filter>
<filter id="glitch_t">
