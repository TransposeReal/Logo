<feOffset in="displaced_base_t" dx="-7" dy="0" result="offset_geom1_t"></feOffset>
<feOffset in="displaced_base_t" dx="7" dy="0" result="offset_geom2_t"></feOffset>
<feFlood result="flood1_t" flood-color="#EE00EE" flood-opacity="1"></feFlood>
<feFlood result="flood2_t" flood-color="#7FFF00" flood-opacity="1"></feFlood>
<feComposite in="flood1_t" in2="offset_geom1_t" operator="in" result="layer1_t"></feComposite>
<feComposite in="flood2_t" in2="offset_geom2_t" operator="in" result="layer2_t"></feComposite>
<feMerge>
<feMergeNode in="layer1_t"></feMergeNode>
<feMergeNode in="layer2_r"></feMergeNode>
<feMergeNode in="displaced_base_t"></feMergeNode>
</feMerge>
</filter>
